<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#heroGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Abstract Tech Shapes -->
  <circle cx="950" cy="220" r="160" fill="#3b82f6" opacity="0.12" filter="blur(40px)" />
  <circle cx="250" cy="450" r="180" fill="#06b6d4" opacity="0.10" filter="blur(50px)" />

  <!-- Central Card -->
  <rect x="250" y="115" width="700" height="400" rx="24" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Icons and Visual elements -->
  <g transform="translate(600, 230)">
    <!-- Scientific nodes and graph -->
    <circle cx="-160" cy="0" r="32" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
    <path d="M-170 -10 L-150 10 M-170 10 L-150 -10" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    
    <circle cx="160" cy="0" r="32" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-width="2" />
    <circle cx="160" cy="0" r="12" fill="#a78bfa" />

    <!-- Connecting line with pulsing dots -->
    <path d="M-128 0 L128 0" stroke="#64748b" stroke-width="2" stroke-dasharray="6,6" />
    
    <circle cx="0" cy="-40" r="42" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="3" />
    <!-- Lightbulb / Data icon inside center -->
    <path d="M-10 -50 C-10 -60 10 -60 10 -50 C10 -42 4 -38 4 -34 L-4 -34 C-4 -38 -10 -42 -10 -50 Z M-4 -30 L4 -30 M-2 -26 L2 -26" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">METODOLOGÍA DE LA INVESTIGACIÓN</text>
  <text x="600" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="url(#accentGrad)" text-anchor="middle">Rutas Cuantitativa, Cualitativa y Aplicación en Software</text>
  
  <!-- Placeholder badge bottom -->
  <rect x="420" y="430" width="360" height="38" rx="19" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="600" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">
    Placeholder activo | Reemplazar por img/hero-portada.jpg
  </text>
</svg>

