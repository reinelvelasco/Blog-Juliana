<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="toolsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#toolsGrad)" rx="16"/>

  <text x="400" y="55" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">TÉCNICAS E INSTRUMENTOS CIENTÍFICOS</text>

  <!-- 5 Cards for the 5 techniques -->
  <!-- 1. Encuesta -->
  <g transform="translate(60, 95)">
    <rect width="115" height="230" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="57" cy="45" r="22" fill="#0369a1" fill-opacity="0.2"/>
    <!-- Checklist icon -->
    <path d="M47 45 L54 52 L68 38" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="57" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">CUESTIONARIO</text>
    <text x="57" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Escalas Likert</text>
    <text x="57" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Muestras amplias</text>
    <text x="57" y="190" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#38bdf8" text-anchor="middle">Estandarizado</text>
  </g>

  <!-- 2. Entrevista -->
  <g transform="translate(200, 95)">
    <rect width="115" height="230" rx="10" fill="#0f172a" stroke="#7e22ce" stroke-width="1.5"/>
    <circle cx="57" cy="45" r="22" fill="#6b21a8" fill-opacity="0.2"/>
    <!-- Mic icon -->
    <rect x="52" y="33" width="10" height="18" rx="5" fill="none" stroke="#c084fc" stroke-width="2"/>
    <path d="M47 43 C47 52 67 52 67 43 M57 52 L57 58 M51 58 L63 58" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round"/>
    <text x="57" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">ENTREVISTA</text>
    <text x="57" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">En profundidad</text>
    <text x="57" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Semiestructurada</text>
    <text x="57" y="190" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#c084fc" text-anchor="middle">Discurso y voz</text>
  </g>

  <!-- 3. Observación -->
  <g transform="translate(340, 95)">
    <rect width="115" height="230" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <circle cx="57" cy="45" r="22" fill="#047857" fill-opacity="0.2"/>
    <!-- Eye icon -->
    <path d="M44 45 C48 37 66 37 70 45 C66 53 48 53 44 45 Z" fill="none" stroke="#34d399" stroke-width="2"/>
    <circle cx="57" cy="45" r="4" fill="#34d399"/>
    <text x="57" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">OBSERVACIÓN</text>
    <text x="57" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">De campo</text>
    <text x="57" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Participante</text>
    <text x="57" y="190" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#34d399" text-anchor="middle">Contexto vivo</text>
  </g>

  <!-- 4. Grupos Focales -->
  <g transform="translate(480, 95)">
    <rect width="115" height="230" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="57" cy="45" r="22" fill="#b45309" fill-opacity="0.2"/>
    <!-- Users icon -->
    <circle cx="50" cy="42" r="6" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="64" cy="42" r="6" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M42 54 C42 49 58 49 58 54 M56 54 C56 50 72 50 72 54" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="57" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">GRUPO FOCAL</text>
    <text x="57" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Debate grupal</text>
    <text x="57" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Consenso / tensión</text>
    <text x="57" y="190" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#fbbf24" text-anchor="middle">Interacción social</text>
  </g>

  <!-- 5. Revisión Documental -->
  <g transform="translate(620, 95)">
    <rect width="115" height="230" rx="10" fill="#0f172a" stroke="#e11d48" stroke-width="1.5"/>
    <circle cx="57" cy="45" r="22" fill="#be123c" fill-opacity="0.2"/>
    <!-- Doc icon -->
    <path d="M50 33 L62 33 L67 38 L67 57 L50 57 Z" fill="none" stroke="#fb7185" stroke-width="1.8"/>
    <line x1="54" y1="42" x2="63" y2="42" stroke="#fb7185" stroke-width="1.5"/>
    <line x1="54" y1="48" x2="63" y2="48" stroke="#fb7185" stroke-width="1.5"/>
    <text x="57" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">DOCUMENTAL</text>
    <text x="57" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Repositorios</text>
    <text x="57" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Logs y código</text>
    <text x="57" y="190" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#fb7185" text-anchor="middle">Evidencia dura</text>
  </g>

  <text x="400" y="380" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">
    Placeholder activo | Reemplazar por img/tecnicas-recoleccion.jpg
  </text>
</svg>

